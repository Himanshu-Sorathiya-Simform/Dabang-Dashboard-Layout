<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet" />

		<title>Dashboard</title>

		<link
			rel="stylesheet"
			href="./style.css" />
	</head>

	<body>
		<div class="container">
			<aside class="sidebar">
				<div class="dabang-logo__container">
					<svg class="dabang__logo dabang__logo--primary">
						<use xlink:href="./assets/dabang_logo.svg"></use>
					</svg>

					<h1 class="dabang__heading">Dabang</h1>
				</div>

				<nav class="sidebar-nav">
					<ul>
						<li class="sidebar-nav__item">
							<a
								href="#"
								class="sidebar-nav__link sidebar-nav__link--active">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-dashboard"></use>
								</svg>

								<span>Dashboard</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-leaderboard"></use>
								</svg>

								<span>Leaderboard</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-order"></use>
								</svg>

								<span>Order</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-product"></use>
								</svg>

								<span>Products</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-sales"></use>
								</svg>

								<span>Sales Report</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-message"></use>
								</svg>

								<span>Messages</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-setting"></use>
								</svg>

								<span>Settings</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-logout"></use>
								</svg>

								<span>Sign Out</span>
							</a>
						</li>
					</ul>
				</nav>

				<article class="dabang-ad">
					<svg class="dabang__logo dabang__logo--secondary">
						<use xlink:href="./assets/dabang_logo.svg"></use>
					</svg>

					<h2 class="dabang-ad__heading">Dabang Pro</h2>

					<p class="dabang-ad__description">
						Get access to all features on tetumbas
					</p>

					<button class="btn btn--primary">Get Pro</button>
				</article>
			</aside>

			<header class="header">
				<section class="header__left">
					<h2 class="page__heading">Dashboard</h2>
				</section>

				<section class="header__right">
					<div class="header__search-container">
						<input
							type="text"
							placeholder="Search here ..."
							class="header__search-input" />

						<svg class="header__search-icon">
							<use
								xlink:href="./assets/ui_icon_sprite.svg#icon-search"></use>
						</svg>
					</div>

					<div class="header__country-dropdown-container">
						<div class="header__country-dropdown">
							<img
								src="https://upload.wikimedia.org/wikipedia/commons/b/bc/Flag_of_India.png"
								alt="Indian Flag"
								class="header__country-dropdown--country-flag" />

							<span class="header__country-dropdown--country-name"
								>Eng (IN)</span
							>
						</div>
					</div>

					<div class="header__user-container">
						<svg class="header__notification-icon">
							<use xlink:href="./assets/ui_icon_sprite.svg#icon-bell"></use>
						</svg>

						<div class="header__user">
							<img
								src="https://tse3.mm.bing.net/th/id/OIP.toaFLyXgh0hY8B66SUaJiwAAAA?cb=defcachec2&rs=1&pid=ImgDetMain&o=7&rm=3"
								alt="Lionel Ronaldo Image"
								class="header__user--avatar" />

							<div class="header__user--info">
								<span class="header__user--name">Lionel Ronaldo</span>
								<span class="header__user--role">Software Engineer</span>
							</div>
						</div>
					</div>
				</section>
			</header>
		</div>
	</body>
</html>
