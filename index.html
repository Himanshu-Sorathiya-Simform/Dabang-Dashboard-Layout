<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />
		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
			rel="stylesheet" />

		<title>Dashboard</title>

		<link
			rel="stylesheet"
			href="./style.css" />
	</head>

	<body>
		<div class="container">
			<aside class="sidebar">
				<div class="dabang-logo__container">
					<svg class="dabang__logo dabang__logo--primary">
						<use xlink:href="./assets/dabang_logo.svg"></use>
					</svg>

					<h1 class="dabang__heading">Dabang</h1>
				</div>

				<nav class="sidebar-nav">
					<ul>
						<li class="sidebar-nav__item">
							<a
								href="#"
								class="sidebar-nav__link sidebar-nav__link--active">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-dashboard"></use>
								</svg>

								<span>Dashboard</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-leaderboard"></use>
								</svg>

								<span>Leaderboard</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-order"></use>
								</svg>

								<span>Order</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-product"></use>
								</svg>

								<span>Products</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-sales"></use>
								</svg>

								<span>Sales Report</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-message"></use>
								</svg>

								<span>Messages</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-setting"></use>
								</svg>

								<span>Settings</span>
							</a>
						</li>

						<li class="sidebar-nav__item">
							<a
								href=""
								class="sidebar-nav__link">
								<svg>
									<use
										xlink:href="./assets/ui_icon_sprite.svg#icon-logout"></use>
								</svg>

								<span>Sign Out</span>
							</a>
						</li>
					</ul>
				</nav>

				<article class="dabang-ad">
					<svg class="dabang__logo dabang__logo--secondary">
						<use xlink:href="./assets/dabang_logo.svg"></use>
					</svg>

					<h2 class="dabang-ad__heading">Dabang Pro</h2>

					<p class="dabang-ad__description">
						Get access to all features on tetumbas
					</p>

					<button class="btn btn--primary">Get Pro</button>
				</article>
			</aside>
		</div>
	</body>
</html>
